name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Foundry Contracts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests
        run: |
          cd contracts
          forge --version
          forge test -vvv

  sdk:
    name: SDK Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @veil/sdk build

      - name: Test SDK
        run: pnpm --filter @veil/sdk test

  web:
    name: Web App Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build SDK dependency
        run: pnpm --filter @veil/sdk build

      - name: Build Web App
        run: pnpm --filter web build

  e2e:
    name: Full-stack e2e (anvil + relayer + SDK + x402 + mm plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @veil/sdk build
      - run: cd contracts && forge build
      - run: cd packages/mm-plugin && npx tsc -p tsconfig.json
      - name: Run e2e
        run: |
          anvil --silent &
          sleep 2
          node e2e/client-e2e.mjs
          node e2e/mm-plugin-e2e.mjs
