[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
